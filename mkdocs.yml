site_name: microplotpy
site_description: Literature-grounded microbial ecology plots from tidy input, with an upload-time validator.
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Data format: data-format.md
  - Taxonomy plots:
      - Barplot: barplot.md
      - Heatmap: heatmap.md
      - Bubbleplot: bubbleplot.md
      - Gradient: gradient.md
      - Alpha diversity: alpha_diversity.md
      - Beta diversity: beta_diversity.md
      - Treemap: treemap.md
  - Functional profiles: function_profile.md
  - Metagenomics:
      - MAG quality: mag_quality.md
      - Assembly QC: assembly.md
